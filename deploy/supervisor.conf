[program:multivendor-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/multivendor/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/multivendor/storage/logs/worker.log
stopwaitsecs=3600

[program:multivendor-scheduler]
process_name=%(program_name)s
command=php /var/www/multivendor/artisan schedule:work
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/multivendor/storage/logs/scheduler.log
